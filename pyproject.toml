[project]
name = "quizsolverbot"
version = "0.1.0"
description = "Telegram quiz bot with SQLite and SQLAlchemy"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Andrey Melchikov", email = "andrei.melchikov25@gmail.com"}
]
dependencies = [
    "aiogram>=3.31.0",
    "python-dotenv>=1.2.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "aiosqlite>=0.22.1",
    "sqlalchemy[asyncio]>=2.0.38",
    "alembic>=1.20.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "aiohttp-socks>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.0",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402"]
"alembic/versions/*" = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
